[package]
name = "xmip-core-test-module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-test-module"
description = "An external module over the Xmip ABI, built by itself and loaded by the runtime's loader in its tests: a content contract with its entrypoint, contract table and lifecycle."
publish.workspace = true

[lib]
path = "src/lib.rs"
# A loadable module for the host, and a library so the tests can drive the
# entrypoint without a loader.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The contract trait, and the export that gives this crate its entry point and
# table: what a provider's Rust contract depends on too.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[lints]
workspace = true
